// Fred probe console for a running CN QuickStart LocalNet (Splice 0.6.11). Runs in a container on
// the `localnet` docker network; admin APIs are unauthenticated, ledger APIs use the LocalNet HS256 dev JWT.
canton.features { enable-testing-commands = yes, enable-preview-commands = yes, enable-repair-commands = yes }
canton.parameters.non-standard-config = yes
canton.remote-sequencers.sequencer {
  public-api { address = canton, port = 5008 }
  admin-api  { address = canton, port = 5009 }
}
canton.remote-mediators.mediator.admin-api { address = canton, port = 5007 }
canton.remote-participants.sv { ledger-api { address = canton, port = 4901 }, admin-api { address = canton, port = 4902 }, token = ${TOKEN} }
canton.remote-participants.aprov { ledger-api { address = canton, port = 3901 }, admin-api { address = canton, port = 3902 }, token = ${TOKEN} }
canton.remote-participants.auser { ledger-api { address = canton, port = 2901 }, admin-api { address = canton, port = 2902 }, token = ${TOKEN} }

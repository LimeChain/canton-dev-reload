// Postgres-backed sandbox (docker postgres:16 on 5433).
// repair.* and pruning require DB persistence; the in-memory sandbox refuses both.
// NOTE: the sequencer NODE store and the reference-sequencer DRIVER store must use
//       SEPARATE databases, or Flyway migrations collide and the sequencer won't init.
canton.participants.sandbox.storage = {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = { serverName = "localhost", portNumber = 5433, databaseName = "canton_participant", user = "canton", password = "canton" }
  }
  parameters.migrate-and-start = yes
}
canton.sequencers.sequencer1.storage = {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = { serverName = "localhost", portNumber = 5433, databaseName = "canton_sequencer", user = "canton", password = "canton" }
  }
  parameters.migrate-and-start = yes
}
canton.sequencers.sequencer1.sequencer.config.storage = {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = { serverName = "localhost", portNumber = 5433, databaseName = "canton_sequencer_driver", user = "canton", password = "canton" }
  }
  parameters.migrate-and-start = yes
}
canton.mediators.mediator1.storage = {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = { serverName = "localhost", portNumber = 5433, databaseName = "canton_mediator", user = "canton", password = "canton" }
  }
  parameters.migrate-and-start = yes
}

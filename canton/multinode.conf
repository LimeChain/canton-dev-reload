# Multi-node fixture for the MN rows (docs/test-plan-multinode-purge.md).
# Two participants (provider, user) and two synchronizers (syncA = sequencerA + mediatorA,
# syncB = sequencerB + mediatorB). Shape copied from Canton 3.5.12's bundled
# sandbox/sandbox-multi-sync.conf; ports moved to 9xxx/10xxx so it never collides with a dpm sandbox.
# Topology, synchronizer bootstrap and dynamic parameters are set by console/mn-lib.canton.
canton {
  parameters.non-standard-config = yes
  features.enable-repair-commands = yes
  features.enable-preview-commands = yes
  features.enable-testing-commands = yes

  participants {
    provider {
      admin-api.port = 9866
      ledger-api.port = 9865
      http-ledger-api.port = 9864
      # repair.purge refuses in-memory storage ("Use db persistence", MN3), so participants persist
      # to H2 files that scripts/74-multinode.sh wipes before every row.
      storage {
        type = h2
        config {
          url = "jdbc:h2:file:"${MN_H2_DIR}"/provider;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
          user = "provider"
          password = "pw"
          driver = org.h2.Driver
        }
      }
    }
    user {
      admin-api.port = 10866
      ledger-api.port = 10865
      http-ledger-api.port = 10864
      # repair.purge refuses in-memory storage ("Use db persistence", MN3), so participants persist
      # to H2 files that scripts/74-multinode.sh wipes before every row.
      storage {
        type = h2
        config {
          url = "jdbc:h2:file:"${MN_H2_DIR}"/user;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
          user = "user"
          password = "pw"
          driver = org.h2.Driver
        }
      }
    }
  }
  sequencers {
    sequencerA {
      admin-api.port = 9868
      public-api.port = 9867
      sequencer { type = reference, config.storage.type = memory }
      storage.type = memory
    }
    sequencerB {
      admin-api.port = 10868
      public-api.port = 10867
      sequencer { type = reference, config.storage.type = memory }
      storage.type = memory
    }
  }
  mediators {
    mediatorA.admin-api.port = 9869
    mediatorB.admin-api.port = 10869
  }
}

# Remote console view of the multinode.conf daemon (MN6, PQS-P). Ports must match multinode.conf.
canton {
  features.enable-repair-commands = yes
  features.enable-preview-commands = yes
  features.enable-testing-commands = yes
  remote-participants {
    provider { admin-api { address = "127.0.0.1", port = 9866 }, ledger-api { address = "127.0.0.1", port = 9865 } }
    user     { admin-api { address = "127.0.0.1", port = 10866 }, ledger-api { address = "127.0.0.1", port = 10865 } }
  }
  remote-sequencers {
    sequencerA { admin-api { address = "127.0.0.1", port = 9868 }, public-api { address = "127.0.0.1", port = 9867 } }
    sequencerB { admin-api { address = "127.0.0.1", port = 10868 }, public-api { address = "127.0.0.1", port = 10867 } }
  }
}
